# Server + coturn 自建部署示例。
# 使用前：cp env.example .env 并填写；然后 docker compose --env-file .env up -d
#
# coturn 使用 host 网络：需要真实源 IP 和 UDP relay 端口段，仅适用于 Linux。
# 如果不用 TURN：删除 coturn 服务，并在 .env 中清空 DSH_SERVER_TURN_*。

services:
  server:
    image: pcject/dsh-remote:v0.6.2
    container_name: dsh-remote-server
    restart: unless-stopped
    ports:
      # 仅监听本机，由外层反向代理转发；不要直接暴露到公网
      - "127.0.0.1:8080:8080"
    environment:
      DSH_SERVER_ACCOUNT: ${DSH_SERVER_ACCOUNT:?}
      DSH_SERVER_PASSWORD: ${DSH_SERVER_PASSWORD:?}
      DSH_SERVER_PUBLIC_URL: ${DSH_SERVER_PUBLIC_URL:?}
      DSH_SERVER_STUN_URLS: ${DSH_SERVER_STUN_URLS:-}
      DSH_SERVER_TURN_URLS: ${DSH_SERVER_TURN_URLS:-}
      DSH_SERVER_TURN_SECRET: ${DSH_SERVER_TURN_SECRET:-}
      DSH_SERVER_TURN_TTL_SECONDS: ${DSH_SERVER_TURN_TTL_SECONDS:-300}
      DSH_SERVER_TRUSTED_PROXY_IPS: ${DSH_SERVER_TRUSTED_PROXY_IPS:-}
    volumes:
      - dsh-remote-data:/data

  coturn:
    image: coturn/coturn:4.6.2
    container_name: dsh-remote-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${DSH_SERVER_TURN_SECRET:?}
      - --realm=${TURN_REALM:-dsh-remote}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      # 云主机/1:1 NAT 必须填公网 IP；物理机直接有公网 IP 时也填该 IP
      - --external-ip=${TURN_EXTERNAL_IP:?}

volumes:
  dsh-remote-data:
